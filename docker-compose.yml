services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tutorslot_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published: port 5432 on this machine is already the local dev Postgres. Containers
    # reach this one over the compose network as "db:5432" regardless.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tutorslot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tutorslot_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The mock notification service runs inside this same container (same app, same JVM), so
      # localhost is correct here, not "app".
      NOTIFICATION_BASE_URL: http://localhost:8080/mock-notify
      # Compose reads GEMINI_API_KEY from the .env file next to this one (never committed). With
      # no key, the placeholder keeps the app starting with AI turned off; an empty value would
      # stop Spring AI from starting at all.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      # Containers default to UTC. Slot times are local (no time zone), so the app must run on the
      # tutors' clock, or in the evening it thinks it's already tomorrow and calls tonight's slots
      # past. Java uses its own time zone data, and the JDBC driver passes the zone to Postgres, so
      # NOW() and CURRENT_DATE in SQL follow it too.
      TZ: America/Los_Angeles
      # Signs the Next.js app's login tokens. Optional: left empty, the app makes a random key at
      # startup, and logins simply end when the container restarts. Set it in .env to keep them.
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # The Next.js frontend. The browser only talks to this service; it passes every /api call on to
  # "app" over the compose network (see frontend/Dockerfile).
  web:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
