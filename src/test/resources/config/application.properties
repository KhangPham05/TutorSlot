# Test-only overrides. Spring Boot reads config/application.properties on top of the main
# application.properties, so every @SpringBootTest picks these up without changing the test.

# One day: the reminder job never runs by itself during a test run (it would send reminders for
# the seed data's upcoming sessions and change rows other tests look at).
reminders.interval-ms=86400000

# Tests get their own schema, tutorslot_test, inside the same tutorslot_db database. Flyway
# creates it on first use, so there is nothing to set up, and the app's data (in the public
# schema) is never touched: the app and the tests can even run at the same time.
spring.datasource.url=jdbc:postgresql://localhost:5432/tutorslot_db?currentSchema=tutorslot_test
spring.flyway.schemas=tutorslot_test
# Lets TestDatabaseConfig wipe that schema before each test context starts.
spring.flyway.clean-disabled=false
