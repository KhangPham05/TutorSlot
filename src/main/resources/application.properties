spring.datasource.url=jdbc:postgresql://localhost:5432/tutorslot_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Never leak stack traces or exception messages to the browser; our own error/ templates
# (see GlobalExceptionHandler) handle every status code we actually produce.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
