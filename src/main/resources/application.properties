spring.datasource.url=jdbc:postgresql://localhost:5432/tutorslot_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql

# Never leak stack traces or exception messages to the browser; our own error/ templates
# (see GlobalExceptionHandler) handle every status code we actually produce.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Mock external notification service (com.tutorslot.mocknotification) -- simulates a real
# third-party service: an API key instead of a session, and a mode we can flip at runtime to
# test/demo outages.
notification.api-key=${NOTIFICATION_API_KEY:dev-key}
mock.notification.mode=UP

# The client side (com.tutorslot.notification) that calls the service above.
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080/mock-notify}
notification.connect-timeout-ms=500
notification.read-timeout-ms=1500
notification.max-attempts=3
notification.resend-interval-ms=30000

# Explicit, even though INFO is Boot's default root level anyway. The default console pattern
# already includes the thread name ([%15.15t]) -- confirmed in the Step 4/5 demos, where
# "notify-1" showed up next to each async listener's log line.
logging.level.com.tutorslot=INFO

# base-path=/ puts health at /health instead of /actuator/health. Only health and metrics are
# exposed -- no env, beans, or other endpoints that would leak internals in a demo.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
