spring.datasource.url=jdbc:postgresql://localhost:5432/tutorslot_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# The tables come from Flyway: at startup it applies any file in classpath:db/migration that
# hasn't run yet (its default location), and leaves existing data alone. Its clean command, which
# wipes the database, stays disabled here (Spring Boot's default); only tests turn it on.

# Never leak stack traces or exception messages to the browser; our own error/ templates
# (see GlobalExceptionHandler) handle every status code we actually produce.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Mock external notification service (com.tutorslot.mocknotification) -- simulates a real
# third-party service: an API key instead of a session, and a mode we can flip at runtime to
# test/demo outages.
notification.api-key=${NOTIFICATION_API_KEY:dev-key}
mock.notification.mode=UP

# The client side (com.tutorslot.notification) that calls the service above.
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8080/mock-notify}
notification.connect-timeout-ms=500
notification.read-timeout-ms=1500
notification.max-attempts=3
notification.resend-interval-ms=30000

# Explicit, even though INFO is Boot's default root level anyway. The default console pattern
# already includes the thread name ([%15.15t]) -- confirmed in the Step 4/5 demos, where
# "notify-1" showed up next to each async listener's log line.
logging.level.com.tutorslot=INFO

# base-path=/ puts health at /health instead of /actuator/health. Only health and metrics are
# exposed -- no env, beans, or other endpoints that would leak internals in a demo.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Milestone 4: Gemini through Spring AI (Gemini Developer API, free tier). The key only ever comes
# from the GEMINI_API_KEY environment variable, never from this file. Setting api-key is what puts
# Spring AI in Developer API mode; project-id and location are deliberately never set, because
# they switch it to Vertex AI, which rejects a free AI Studio key.
# "not-configured" is a harmless placeholder: Spring AI refuses to start with a blank key, and the
# app and every test must start with no key at all (CI has none). AiAvailability treats the
# placeholder as "AI disabled", so nothing ever sends it to Google.
# Embeddings read their own api-key property, so both point at the same variable.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-configured}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:not-configured}
# Model: gemini-3.5-flash-lite, a free-tier Flash Lite model that answered every call in under
# 6 seconds when checked with a real key on 2026-11-17. (gemini-3.1-flash-lite sometimes took
# over 20 seconds, gemini-2.5-flash is closed to new users, and gemini-3.7-flash and
# gemini-3.8-flash returned 503 "high demand" on the free tier.) Override with GEMINI_MODEL.
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
# Limits for one Gemini chat call (see AiConfig). A healthy call takes about 1 second; past
# these, the chat page shows a friendly "try again" message instead of hanging.
gemini.timeout-ms=20000
# 2 = the first try plus one quick retry (about 1 second later) for a momentary 503 or 429.
gemini.max-attempts=2
# ReminderAgent: every 15 minutes, remind students of sessions starting in the next 24 hours.
# max-per-run caps the Gemini calls per run to protect the free quota; leftovers go next run.
reminders.interval-ms=900000
reminders.window-hours=24
reminders.max-per-run=5

# Spring AI's retry listener logs a full stack trace at WARN for every failed Gemini call.
# AssistantService already logs one short line per failure, so keep the console readable.
logging.level.org.springframework.ai.retry=ERROR
