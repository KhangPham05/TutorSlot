<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments Booked With Me - TutorSlot</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        table { border-collapse: collapse; width: 100%; margin-bottom: 24px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Appointments Booked With Me</h1>

<h2>Upcoming</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Student</th>
        <th>Subject</th>
        <th>Start</th>
        <th>End</th>
        <th>Notes</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="appt : ${myAppointments.upcoming}">
        <td th:text="${appt.customerName}">Student</td>
        <td th:text="${appt.subjectName}">Subject</td>
        <td th:text="${#temporals.format(appt.startTime, 'MMM d, h:mm a')}">Start</td>
        <td th:text="${#temporals.format(appt.endTime, 'h:mm a')}">End</td>
        <td th:text="${appt.notes}">Notes</td>
    </tr>
    </tbody>
</table>
<p th:if="${myAppointments.upcoming.isEmpty()}">No upcoming appointments.</p>

<h2>History</h2>
<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Student</th>
        <th>Subject</th>
        <th>Start</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="appt : ${myAppointments.history}">
        <td th:text="${appt.customerName}">Student</td>
        <td th:text="${appt.subjectName}">Subject</td>
        <td th:text="${#temporals.format(appt.startTime, 'MMM d, h:mm a')}">Start</td>
        <td th:text="${appt.status}">Status</td>
    </tr>
    </tbody>
</table>
<p th:if="${myAppointments.history.isEmpty()}">No past appointments yet.</p>
</body>
</html>
