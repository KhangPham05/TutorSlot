    <line x1="310" y1="322" x2="550" y2="322" stroke="#e2e8f0" stroke-width="1" />
    <line x1="310" y1="344" x2="550" y2="344" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <!-- SERVICES -->
  <g>
    <rect x="590" y="226" width="220" height="118" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.6" />
    <rect x="590" y="226" width="220" height="30" rx="6" fill="#1e3a8a" />
