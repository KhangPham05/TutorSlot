  <text x="290" y="70" text-anchor="middle" font-size="11" fill="#475569">1 : 0..1</text>

  <line x1="150" y1="136" x2="150" y2="226" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="168" y="184" text-anchor="middle" font-size="11" fill="#475569">1 : N</text>

  <line x1="430" y1="114" x2="430" y2="226" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="448" y="184" text-anchor="middle" font-size="11" fill="#475569">1 : N</text>

  <line x1="520" y1="114" x2="610" y2="226" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="600" y="165" text-anchor="middle" font-size="11" fill="#475569">1 : N</text>

  <line x1="590" y1="285" x2="550" y2="296" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="570" y="275" text-anchor="middle" font-size="11" fill="#475569">1 : N</text>

  <line x1="310" y1="296" x2="260" y2="285" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="285" y="275" text-anchor="middle" font-size="11" fill="#475569">1 : N</text>

  <!-- USERS -->
  <g>
    <rect x="40" y="40" width="220" height="96" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.6" />
    <rect x="40" y="40" width="220" height="30" rx="6" fill="#1e3a8a" />
    <rect x="40" y="58" width="220" height="12" fill="#1e3a8a" />
    <text x="150" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">USERS</text>
    <text x="52" y="86" font-size="12" fill="#0f172a">user_id</text>
    <text x="248" y="86" text-anchor="end" font-size="11" font-weight="700" fill="#1e3a8a">PK</text>
    <text x="52" y="108" font-size="12" fill="#0f172a">email</text>
