<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 410" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="870" height="410" fill="#ffffff" />

  <!-- connectors (drawn first, under the boxes) -->
